; Iram-style flush top bar. The theme script prepends [colors] and writes
; the result to ~/.local/state/iram-x11/polybar.ini
[settings]
screenchange-reload = true

[bar/iram]
width = 100%
height = 30
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrains Mono:size=10;2
font-2 = monospace:size=10;2
modules-left = menu workspaces title
modules-center = date
modules-right = theme memory power
wm-restack = i3
enable-ipc = true

[module/menu]
type = custom/text
format = " IRAM "
format-foreground = ${colors.bg}
format-background = ${colors.accent}
click-left = rofi -show drun

[module/workspaces]
type = internal/xworkspaces
enable-click = true
enable-scroll = false
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-underline = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/memory]
type = internal/memory
interval = 5
label = RAM %percentage_used%%

[module/theme]
type = custom/text
format = THEME
format-foreground = ${colors.accent}
click-left = ~/termux-dotfiles/iram-x11/theme pick

[module/power]
type = custom/text
format = POWER
format-foreground = ${colors.red}
click-left = ~/termux-dotfiles/iram-x11/menu power
