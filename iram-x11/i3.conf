# IRAM OS for Termux:X11: i3 port of Iram's Hyprland layout and keybindings.
# Generated theme values (colours) live in ~/.local/state/iram-x11/i3-colors
set $mod Mod4
set $alt Mod1
set $x ~/termux-dotfiles/iram-x11

font pango:JetBrainsMono Nerd Font, JetBrains Mono, monospace 10
floating_modifier $mod
tiling_drag modifier titlebar
focus_follows_mouse no

# Iram look: sharp corners, 2px border, 6/12 gaps, no gaps with a single window
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart_no_gaps
gaps inner 6
gaps outer 6
smart_gaps on

include ~/.local/state/iram-x11/i3-colors

# Apps — terminals and browsers
bindsym $mod+Return exec --no-startup-id $x/open term
bindsym $mod+b exec --no-startup-id $x/open browser
bindsym $mod+Shift+Return exec --no-startup-id $x/open browser
bindsym $mod+e exec --no-startup-id $x/open files
bindsym $mod+Shift+f exec --no-startup-id $x/open files
bindsym $mod+Shift+n exec --no-startup-id $x/open term -e nvim

# Apps — tools and utilities
bindsym $mod+Ctrl+t exec --no-startup-id $x/open term -e btop
bindsym $mod+Shift+d exec --no-startup-id $x/open term -e lazygit
bindsym $mod+Ctrl+e exec --no-startup-id $x/open editor
bindsym $mod+Ctrl+a exec --no-startup-id $x/open calc
bindsym $mod+Ctrl+q exec --no-startup-id $x/open calc
bindsym $mod+i exec --no-startup-id $x/open settings
bindsym $mod+Shift+s exec --no-startup-id $x/open screenshot
bindsym $mod+Ctrl+m exec --no-startup-id $x/open term -e cava
bindsym $mod+Shift+i exec --no-startup-id $x/open task
bindsym $mod+Shift+p exec --no-startup-id pavucontrol
bindsym $mod+n exec --no-startup-id dunstctl close
bindsym $mod+Shift+comma exec --no-startup-id dunstctl close-all

# Launchers and menus
bindsym $mod+space exec --no-startup-id rofi -show drun -show-icons
bindsym Ctrl+space exec --no-startup-id rofi -show drun -show-icons
bindsym $mod+d exec --no-startup-id rofi -show run
bindsym $mod+t exec --no-startup-id $x/theme pick
bindsym $mod+Shift+w exec --no-startup-id $x/theme next-bg
bindsym $mod+Escape exec --no-startup-id $x/menu power
bindsym $mod+k exec --no-startup-id $x/menu keys

# Float specific windows
for_window [class="Galculator"] floating enable
for_window [class="Pavucontrol"] floating enable
for_window [class="Lxappearance"] floating enable
for_window [class="Xfce4-taskmanager"] floating enable
for_window [title="xfce4-screenshooter"] floating enable

# Windows
bindsym $mod+q kill
bindsym $mod+w kill
bindsym $mod+f fullscreen toggle
bindsym $mod+$alt+v floating toggle
bindsym $mod+j split toggle
bindsym $mod+o sticky toggle
bindsym $mod+g layout toggle tabbed splith
bindsym $mod+m exit
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
bindsym $mod+minus resize shrink width 40 px
bindsym $mod+equal resize grow width 40 px
bindsym $mod+Shift+minus resize shrink height 40 px
bindsym $mod+Shift+equal resize grow height 40 px
bindsym $mod+grave scratchpad show
bindsym $mod+Shift+grave move scratchpad

mode "resize" {
    bindsym Left resize shrink width 20 px
    bindsym Right resize grow width 20 px
    bindsym Up resize shrink height 20 px
    bindsym Down resize grow height 20 px
    bindsym h resize shrink width 20 px
    bindsym l resize grow width 20 px
    bindsym k resize shrink height 20 px
    bindsym j resize grow height 20 px
    bindsym Escape mode "default"
    bindsym Return mode "default"
}
bindsym $mod+r mode "resize"

# Workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10
bindsym $mod+Tab workspace next
bindsym $mod+Shift+Tab workspace prev

# Phone keyboards rarely have Super, so the essentials also work with Alt
bindsym $alt+Return exec --no-startup-id $x/open term
bindsym $alt+space exec --no-startup-id rofi -show drun
bindsym $alt+q kill
bindsym $alt+1 workspace number 1
bindsym $alt+2 workspace number 2
bindsym $alt+3 workspace number 3
bindsym $alt+4 workspace number 4
bindsym $alt+5 workspace number 5

exec_always --no-startup-id $x/theme apply-desktop
